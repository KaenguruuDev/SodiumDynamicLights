name: Build

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SodiumDynamicLights
          path: build/libs/*.jar
