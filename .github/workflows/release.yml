name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build release JAR
        run: ./gradlew build --no-daemon

      - name: Name release asset
        shell: bash
        run: |
          mkdir -p release-assets
          artifact="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$artifact"
          cp "$artifact" "release-assets/SodiumDynamicLights-1.0.10-1.21.1-NeoForge-KaenguruuDev-${{ github.ref_name }}.jar"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/SodiumDynamicLights-1.0.10-1.21.1-NeoForge-KaenguruuDev-${{ github.ref_name }}.jar
